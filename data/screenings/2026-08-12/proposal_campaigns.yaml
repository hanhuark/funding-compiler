# Proposal-campaign metadata is local planning judgment, not sponsor evidence.
records:
  opp-samsung-gro-2026:
    official_source_url: https://semiconductor.samsung.com/sait/event/global-research-outreach/
    sponsor_evidence_scope: "2026 themes, August 23 UTC deadline, non-confidential submission condition, and university research agreement requirement."
    eligibility_disposition: "institutional agreement confirmation required"
    scientific_fit_disposition: "strong thermal-management theme signal; select one device-level mechanism and evidence plan"
    meeg_lanes: [thermal-fluids, materials, energy-systems, diagnostics-ai]
    campaign_status: "rapid go/no-go"
    concept_owner: "Unassigned"
    proposed_roles: [faculty PI, device thermal-management lead, UA agreement reviewer]
    team_gap: "Need one sponsor-aligned research question, an agreement/IP review, and confirmation that no unpublished proprietary detail is needed."
    next_decision: "By August 14, decide whether a ready-to-submit non-confidential thermal-management concept exists."
  opp-doe-sc-continuation-2026:
    official_source_url: https://science.osti.gov/grants/FOAs/Open
    sponsor_evidence_scope: "Current continuation FOA status, named Office of Science program alignment, pre-application guidance, and eligibility."
    eligibility_disposition: "institutional confirmation required"
    scientific_fit_disposition: "manual named-program and scientific-centrality review required"
