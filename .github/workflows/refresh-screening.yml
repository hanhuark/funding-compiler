name: Run funding screening

on:
  workflow_dispatch:
    inputs:
      as_of_date:
        description: "Optional report date (YYYY-MM-DD). Leave blank to use the runner date."
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: funding-screening-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Install package
        run: python -m pip install -e .
      - name: Set report date
        if: inputs.as_of_date != ''
        run: echo "FUNDING_COMPILER_TODAY=${{ inputs.as_of_date }}" >> "$GITHUB_ENV"
      - name: Generate screening artifacts
        run: python tools/generate_screening_report.py
      - name: Validate generated artifacts
        run: git diff --check
      - name: Commit refreshed screening when changed
        run: |
          if git diff --quiet; then
            echo "No screening artifact changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/screenings site/data site/screenings
          git commit -m "Refresh funding screening"
          git push
